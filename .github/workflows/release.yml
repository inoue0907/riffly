name: Release

# Push a tag like v0.1.0 and this builds the Windows executable and publishes
# it as a GitHub Release. The tag must match the version in Cargo.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match the version in Cargo.toml ($version)"
          }

      # The C runtime is linked in, so the exe starts on a PC without the
      # Visual C++ redistributable installed.
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $name = "Riffly-$version-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/riffly.exe "$name/Riffly.exe"
          Copy-Item LICENSE, README.md $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "$env:ASSET" `
            --title "Riffly ${{ github.ref_name }}" `
            --notes-file .github/release-notes.md `
            --generate-notes
