[package]
name = "riffly"
version = "0.1.5"
edition = "2024"
publish = false
description = "Riffly: a block editor for quickly reading, reviewing and fixing markdown, built on GPUI"
license = "MIT"
repository = "https://github.com/inoue0907/riffly"
keywords = ["gpui", "editor", "markdown", "review", "rich-text"]
categories = ["gui", "text-editors"]

[lib]
name = "riffly"
path = "src/lib.rs"

[[bin]]
name = "riffly"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "0.6.1", features = ["tree-sitter-languages"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
unicode-segmentation = "1"
regex = "1.13.1"
scraper = "0.29.0"
async-channel = "2.5.0"
# Video in a document: base64 `data:` URLs, and frames handed to GPUI.
base64 = "0.22"
image = { version = "0.25", default-features = false }
# Updating in place: the GitHub API over HTTPS, and the release zip.
# Release archives are made by Compress-Archive, which only deflates.
ureq = "3.5.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

# The system PDF engine for the PDF viewer, and the registry for
# registering Riffly with Explorer.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "UI",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"
wry = "0.57"

[dev-dependencies]
gpui-kit = { version = "0.6.1", features = ["test-support"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# What the Release workflow ships: smaller and faster, symbols stripped.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"

# GPUI's Windows backend, as published, with one change: its drawing is not
# "topmost", so a child window — the HTML tab's WebView2 — shows above it.
# Upstream GPUI made the same change later (gpui-pre-windows 0.3.12).
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
