[package]
name = "riffly"
version = "0.1.3"
edition = "2024"
publish = false
description = "Riffly: a block editor for quickly reading, reviewing and fixing markdown, built on GPUI"
license = "MIT"
repository = "https://github.com/inoue0907/riffly"
keywords = ["gpui", "editor", "markdown", "review", "rich-text"]
categories = ["gui", "text-editors"]

[lib]
name = "riffly"
path = "src/lib.rs"

[[bin]]
name = "riffly"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "0.6.1", features = ["tree-sitter-languages"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
unicode-segmentation = "1"
regex = "1.13.1"
scraper = "0.29.0"

# The system PDF engine for the PDF viewer, and the registry for
# registering Riffly with Explorer.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "UI",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui-kit = { version = "0.6.1", features = ["test-support"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# What the Release workflow ships: smaller and faster, symbols stripped.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
